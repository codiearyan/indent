<!doctype html>
<!--
  The picture behind the icons in the macOS installer window (660 by 420 points).
  The app's icon sits on the left tile and the Applications folder on the right one; their
  places are set under `dmg` in electron-builder.yml and must match the tiles here.

  Finder writes the names under the icons in white when the Mac is in dark mode and in black
  when it is in light mode, so the tiles are a middle grey that both can be read on.

  To redraw build/background@2x.png and build/background.png after an edit, from apps/desktop:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --allow-file-access-from-files --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=660,420 --screenshot=build/background@2x.png build/dmg/background.html
    sips -z 420 660 build/background@2x.png --out build/background.png
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'IBM Plex Sans';
        font-weight: 400;
        src: url('../../../../packages/design/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-weight: 600;
        src: url('../../../../packages/design/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2');
      }
      html,
      body {
        margin: 0;
        width: 660px;
        height: 420px;
        overflow: hidden;
        background: #1b1b1e;
        font-family: 'IBM Plex Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        position: absolute;
        top: 44px;
        width: 100%;
        margin: 0;
        text-align: center;
        font-size: 25px;
        line-height: 32px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: #efe3d0;
      }
      h1 span {
        color: #ea6030;
      }
      .tile {
        position: absolute;
        top: 122px;
        width: 180px;
        height: 184px;
        border-radius: 30px;
        background: #7c7c83;
      }
      .tile.app {
        left: 100px;
      }
      .tile.folder {
        left: 380px;
      }
      svg {
        position: absolute;
        left: 292px;
        top: 188px;
      }
      p {
        position: absolute;
        bottom: 34px;
        width: 100%;
        margin: 0;
        text-align: center;
        font-size: 12.5px;
        line-height: 18px;
        color: #9a9aa2;
      }
    </style>
  </head>
  <body>
    <h1>Drag Indent into <span>Applications</span></h1>
    <div class="tile app"></div>
    <div class="tile folder"></div>
    <svg width="76" height="52" viewBox="0 0 76 52" fill="none">
      <path
        d="M8 26h54M44 8l20 18-20 18"
        stroke="#ea6030"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <p>The first time you open it, macOS asks you to allow Indent in System Settings, Privacy and Security.</p>
  </body>
</html>
