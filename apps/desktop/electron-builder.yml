appId: com.indent.app
productName: Indent
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Only its index ships, in extraResources; the archives are what the site serves.
  - '!out/packs/**'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
win:
  executableName: indent
# Installer names carry no version, so the newest one always has the same download address.
nsis:
  artifactName: Indent-windows-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Signed with a Developer ID and notarized when the release has the Apple secrets (release.yml);
# electron-builder notarizes on its own once APPLE_API_KEY, _ID and _ISSUER are set.
mac:
  # The .dmg is what people download; the .zip is what the in-app updater installs.
  target:
    - dmg
    - zip
  artifactName: Indent-mac-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: Indent-mac-${arch}.${ext}
  title: Indent
  # The picture is drawn from build/dmg/background.html. Its two tiles sit where `contents`
  # puts the icons (x and y are the centre of each icon), so change both together.
  background: build/background.png
  window:
    width: 660
    height: 420
  iconSize: 104
  iconTextSize: 13
  contents:
    - x: 190
      y: 205
      type: file
    - x: 470
      y: 205
      type: link
      path: /Applications
linux:
  # Without this the name comes from the package name, whose "@" and "/" Linux does not allow.
  executableName: indent
  target: AppImage
  category: Education
appImage:
  artifactName: Indent-linux-${arch}.${ext}
# Where the in-app updater looks: the GitHub release. The release workflow uploads the latest*.yml
# files and blockmaps electron-builder writes next to the installers (it never publishes itself).
publish:
  provider: github
  owner: codiearyan
  repo: indent
npmRebuild: false
beforePack: build/pack-index.mjs
extraResources:
  - from: ../../packages/content
    to: content
    filter:
      - kit/**
      - runtime/**
      - paths.json
      - package.json
      # The first repo of every roadmap; the rest download from the library on first start.
      - labs/html-css-foundations/**
      - labs/typescript-foundations/**
      - labs/command-line-foundations/**
      - labs/js-foundations/**
      - labs/python-foundations/**
  - from: out/packs/index.json
    to: content/index.json
