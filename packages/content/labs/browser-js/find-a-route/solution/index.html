<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gritstone Climbing route board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="masthead">
      <div>
        <p class="gym">Gritstone Climbing</p>
        <h1>Route board</h1>
      </div>
      <p id="tick-count" class="tick-count">0 of 0 ticked</p>
    </header>

    <main class="layout">
      <section class="board" aria-labelledby="board-title">
        <div class="board-head">
          <h2 id="board-title">On the walls</h2>
          <div class="filters">
            <label>
              <span>Search</span>
              <input id="search" type="search" placeholder="Route name" autocomplete="off" />
            </label>
            <label>
              <span>Grade</span>
              <select id="grade-filter">
                <option value="">Any grade</option>
                <option value="easy">Easy, V0 to V2</option>
                <option value="mid">Medium, V3 to V5</option>
                <option value="hard">Hard, V6 and up</option>
              </select>
            </label>
          </div>
        </div>

        <ul id="route-list" class="route-list"></ul>
        <p id="board-empty" class="empty" hidden>No routes on the walls yet.</p>
        <p id="no-match" class="empty" hidden>No routes match.</p>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
