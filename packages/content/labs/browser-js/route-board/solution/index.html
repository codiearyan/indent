<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gritstone Climbing route board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="masthead">
      <div>
        <p class="gym">Gritstone Climbing</p>
        <h1>Route board</h1>
      </div>
    </header>

    <main class="layout">
      <section class="board" aria-labelledby="board-title">
        <div class="board-head">
          <h2 id="board-title">On the walls</h2>
        </div>

        <ul id="route-list" class="route-list"></ul>
        <p id="board-empty" class="empty" hidden>No routes on the walls yet.</p>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
