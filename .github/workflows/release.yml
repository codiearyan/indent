name: Release

# Builds the installers and publishes them as a GitHub release.
#
# It only runs when asked: by hand from the Actions tab, or when a version tag is pushed.
# Nothing here runs on pull requests, because a macOS runner costs ten times the minutes of
# a Linux one. A full release is one macOS job (both chips), one Windows job and one Linux job.
#
#   Actions, Release, Run workflow     raises the version in apps/desktop/package.json (patch by
#                                      default), commits it to main, tags it and publishes
#   publish off                        builds the current version and keeps the installers as run
#                                      artifacts; nothing is committed
#   git tag v0.2.0 && git push ...     publishes a tag that matches apps/desktop/package.json
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      only:
        description: Which installers to build
        type: choice
        options: [all, mac, windows, linux]
        default: all
      publish:
        description: Raise the version and publish a release. Off builds the current version and keeps the installers as run artifacts.
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Seconds on a Linux runner, so a wrong tag never costs a macOS build.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Settle the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME but apps/desktop/package.json says $version. Tag v$version, or run the workflow by hand."
              exit 1
            fi
          elif [ "$PUBLISH" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are published from main. Run the workflow on main, or turn publish off."
              exit 1
            fi
            version=$(cd apps/desktop && npm version "$BUMP" --no-git-tag-version | tr -d v)
            # The repository owner's public GitHub address, so the commit is theirs like every other.
            git config user.name 'Aryan Bhati'
            git config user.email '123343302+codiearyan@users.noreply.github.com'
            git commit -am "chore: release $version"
            git tag "v$version"
            git push --atomic origin HEAD:main "v$version"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pick the platforms
        id: plan
        env:
          ONLY: ${{ inputs.only || 'all' }}
        run: |
          node -e '
            const all = [
              { name: "mac", os: "macos-latest", args: "--mac --arm64 --x64" },
              { name: "windows", os: "windows-latest", args: "--win --x64" },
              { name: "linux", os: "ubuntu-latest", args: "--linux --x64" }
            ]
            const only = process.env.ONLY
            const include = all.filter((job) => only === "all" || only === job.name)
            console.log("matrix=" + JSON.stringify({ include }))
          ' >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @indent/desktop exec electron-vite build
      # macOS: signed with the Developer ID and notarized when the secrets below are set. Without
      # them the apps carry an ad-hoc signature (identity "-"): they run, but macOS asks the person
      # to confirm the first open. The certificate is given to the macOS job only, so electron-builder
      # never tries it on the Windows installer.
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          args="${{ matrix.args }}"
          if [ "${{ matrix.name }}" = mac ]; then
            if [ -n "$MAC_CERT_P12_BASE64" ] && [ -n "$APPLE_API_KEY_P8" ]; then
              export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
              # Without discovery electron-builder finds no identity in the imported certificate.
              export CSC_IDENTITY_AUTO_DISCOVERY=true
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            else
              echo "::warning::No Developer ID secrets: the macOS apps are signed ad-hoc."
              args="$args -c.mac.identity=-"
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
            fi
          fi
          pnpm --filter @indent/desktop exec electron-builder $args --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            apps/desktop/dist/Indent-*.dmg
            apps/desktop/dist/Indent-*.exe
            apps/desktop/dist/Indent-*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: [prepare, build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          ls -l installers
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --target "$SHA" --title "Indent ${TAG#v}" --generate-notes
          fi
