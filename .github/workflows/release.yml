name: Release

# Builds the installers and publishes them as a GitHub release.
#
# It only runs when asked: when a version tag is pushed, or by hand from the Actions tab.
# Nothing here runs on pull requests, because a macOS runner costs ten times the minutes of
# a Linux one. A full release is one macOS job (both chips), one Windows job and one Linux job.
#
#   git tag v0.2.0 && git push origin v0.2.0      a full release
#   Actions, Release, Run workflow                 the same by hand, or one platform without publishing
#
# The tag must match the version in apps/desktop/package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, such as v0.2.0. Created on this commit if it does not exist.
        required: true
      only:
        description: Which installers to build
        type: choice
        options: [all, mac, windows, linux]
        default: all
      publish:
        description: Publish the installers as a release. Off builds them and keeps them as run artifacts.
        type: boolean
        default: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Seconds on a Linux runner, so a wrong tag never costs a macOS build.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the app version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG but apps/desktop/package.json says $version. Change the version first, or tag v$version."
            exit 1
          fi
      - name: Pick the platforms
        id: plan
        env:
          ONLY: ${{ inputs.only || 'all' }}
        run: |
          node -e '
            const all = [
              { name: "mac", os: "macos-latest", args: "--mac --arm64 --x64 -c.mac.identity=-" },
              { name: "windows", os: "windows-latest", args: "--win --x64" },
              { name: "linux", os: "ubuntu-latest", args: "--linux --x64" }
            ]
            const only = process.env.ONLY
            const include = all.filter((job) => only === "all" || only === job.name)
            console.log("matrix=" + JSON.stringify({ include }))
          ' >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @indent/desktop exec electron-vite build
      # The macOS apps carry an ad-hoc signature (identity "-"): they run on any Mac, but macOS
      # asks the person to confirm the first open. A Developer ID certificate would remove that.
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @indent/desktop exec electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            apps/desktop/dist/Indent-*.dmg
            apps/desktop/dist/Indent-*.exe
            apps/desktop/dist/Indent-*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l installers
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --target "$GITHUB_SHA" --title "Indent ${TAG#v}" --generate-notes
          fi
