name: CI

# CI minutes are limited: pull requests only, nothing for docs or lab content,
# and a newer push to the same pull request cancels the older run.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'packages/content/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Type checks, lint and unit tests need neither the Electron binary nor native modules.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
